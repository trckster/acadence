name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - run: npm pack && mv acadence-*.tgz acadence.tgz && sha256sum acadence.tgz > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" acadence.tgz SHA256SUMS --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
